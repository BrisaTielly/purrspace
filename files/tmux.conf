# ~/.tmux.conf — a steady setup for WezTerm + Neovim

# Default tmux prefix: Ctrl+b
set -g prefix C-b
unbind C-a

# Terminal, colors and integration
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",wezterm:Tc"
set -s set-clipboard on
set -g focus-events on

# Behavior
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep the current folder for new panes/windows
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl+b, then H/J/K/L
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload the config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Simple, readable status bar (Catppuccin Mocha)
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#313244,fg=#cdd6f4"
set -g status-left "#[bg=#fab387,fg=#1e1e2e,bold] #S "
set -g status-right "#[fg=#89b4fa]%Y-%m-%d #[fg=#f5c2e7]%H:%M "
set -g window-status-current-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f5c2e7"
set -g default-shell /usr/bin/zsh

# --- Survive reboots -----------------------------------------------
# resurrect saves state to ~/.local/share/tmux/resurrect/; continuum
# saves every so often and restores when the tmux server starts.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# must be the LAST line of the file
run '~/.tmux/plugins/tpm/tpm'
